[project]
name = "seaway"
version = "0.1.0"
description = "Prototype: define the context an agent needs on Archil, then run priced, scoped statements against it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
archil = ["archil>=0.21.0"]
dev = ["pytest>=8", "archil>=0.21.0", "duckdb-cli>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seaway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
